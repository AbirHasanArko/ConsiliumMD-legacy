version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: consilium
      POSTGRES_PASSWORD: consilium
      POSTGRES_DB: consilium
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consilium"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://consilium:consilium@db:5432/consilium
      JWT_SECRET: change-me-in-prod
      REASONING_PROVIDER: mock
      CARMA_BASE_URL: http://carma:8100
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: INFO
      SEED_DEMO_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  # Optional: spin up CARMA alongside in Phase 2. Disabled by default.
  # carma:
  #   build: ../CARMA
  #   ports:
  #     - "8100:8100"

volumes:
  pgdata:
  frontend_node_modules:
